<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 16" shape-rendering="crispEdges">
  <!-- antenna -->
  <path d="M4 2.6 L1 5.6 M4 2.6 L7 5.6" stroke="#14202b" stroke-width="1.4" fill="none"/>
  <rect x="3.3" y="2.6" width="1.4" height="10.4" fill="#14202b"/>
  <rect x="1.5" y="12" width="5" height="1.6" fill="#14202b"/>
  <!-- signal bars -->
  <rect x="10" y="10" width="2" height="3"  fill="#14202b"/>
  <rect x="13" y="8"  width="2" height="5"  fill="#14202b"/>
  <rect x="16" y="6"  width="2" height="7"  fill="#14202b"/>
  <rect x="19" y="4"  width="2" height="9"  fill="#14202b"/>
  <rect x="22" y="2"  width="2" height="11" fill="#14202b"/>
  <!-- battery -->
  <rect x="28" y="4" width="14" height="9" rx="1.4" fill="#3fa34d"/>
  <rect x="42" y="6.4" width="2" height="4.2" rx="0.5" fill="#3fa34d"/>
  <rect x="30.6" y="5.6" width="1.3" height="5.8" fill="#e3f2e6"/>
  <rect x="33.6" y="5.6" width="1.3" height="5.8" fill="#e3f2e6"/>
  <rect x="36.6" y="5.6" width="1.3" height="5.8" fill="#e3f2e6"/>
  <!-- silent / offline -->
  <rect x="48" y="3" width="10" height="10" rx="2" fill="none" stroke="#14202b" stroke-width="1.4"/>
  <line x1="47.4" y1="13.4" x2="58.6" y2="2.6" stroke="#c0392b" stroke-width="1.9"/>
  <!-- message -->
  <rect x="62" y="4" width="15" height="9" rx="1" fill="#e6c33e" stroke="#14202b" stroke-width="0.8"/>
  <path d="M62.4 4.6 L69.5 9.8 L76.6 4.6" fill="none" stroke="#14202b" stroke-width="1"/>
  <!-- camera mode -->
  <rect x="84" y="2" width="4" height="2" fill="#2c5f9e"/>
  <rect x="81" y="4" width="14" height="10" rx="1.4" fill="#2c5f9e"/>
  <circle cx="88" cy="9" r="3" fill="#dbe8f4"/>
  <circle cx="88" cy="9" r="1.4" fill="#2c5f9e"/>
  <!-- quality -->
  <rect x="100" y="3" width="12" height="12" fill="#2c5f9e"/>
  <rect x="100" y="3"  width="4" height="4" fill="#dbe8f4"/>
  <rect x="108" y="3"  width="4" height="4" fill="#dbe8f4"/>
  <rect x="104" y="7"  width="4" height="4" fill="#dbe8f4"/>
  <rect x="100" y="11" width="4" height="4" fill="#dbe8f4"/>
  <rect x="108" y="11" width="4" height="4" fill="#dbe8f4"/>
</svg>
