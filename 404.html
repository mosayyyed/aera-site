<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AERA — No Signal</title>
<meta name="theme-color" content="#0B0B0C">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0B0C'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23D69449' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23D69449'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root { color-scheme: dark; --ground:#0B0B0C; --ink:#fff; --dim:rgba(255,255,255,.46); --amber:#D69449; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--ground); color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    display: grid; place-items: center; text-align: center; padding: 24px;
    background-image: radial-gradient(125% 80% at 50% 40%, transparent 42%, rgba(0,0,0,.55) 100%);
  }
  .code { font-size: clamp(64px, 20vw, 160px); font-weight: 500; letter-spacing: .3em; text-indent: .3em; line-height: 1; }
  p { color: var(--dim); letter-spacing: .18em; text-transform: uppercase; font-size: 11px; margin: 20px 0 30px; }
  a {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 15px 26px; border: 1px solid var(--ink); background: var(--ink); color: var(--ground);
    font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; text-decoration: none;
  }
  a::before { content: "▸"; color: var(--amber); }
  a:hover { background: transparent; color: var(--ink); }
  a:focus-visible { outline: 1px solid var(--amber); outline-offset: 3px; }
  .sign { margin-top: 44px; font-size: 10px; letter-spacing: .44em; text-transform: uppercase; color: rgba(214,148,73,.62); }
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <p>No signal on this frame</p>
    <a id="home" href="/">Back to the viewfinder</a>
    <div class="sign">Capture another era</div>
  </div>
  <script>
    /* keep "home" correct whether the site sits at the domain root or under
       a /repo/ path (GitHub Pages project sites) */
    (function () {
      var seg = location.pathname.split("/").filter(Boolean);
      document.getElementById("home").href =
        location.hostname.endsWith("github.io") && seg.length ? "/" + seg[0] + "/" : "/";
    })();
  </script>
</body>
</html>
